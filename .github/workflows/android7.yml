# Дымовой тест: ставит клиентскую (релизную, R8) сборку на эмуляторы Android 7.0 (API 24) и Android 14 (API 34), запускает,
# открывает демо-машину и проверяет, что процесс жив и в logcat нет падений. Запуск вручную:
#   gh workflow run android7.yml
name: android7

on:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        api: [24, 34]          # Android 7.0 (самый старый поддерживаемый) и Android 14
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: gradle assembleRelease
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell monkey -p io.github.sinsluhi.obdai -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell pidof io.github.sinsluhi.obdai && echo "ПРОЦЕСС ЖИВ" || (echo "ПРОЦЕСС УПАЛ"; adb logcat -d | grep -A 30 "FATAL EXCEPTION"; exit 1)
            adb shell screencap -p /sdcard/s1.png && adb pull /sdcard/s1.png s1.png
            adb shell monkey -p io.github.sinsluhi.obdai --pct-syskeys 0 --throttle 400 -s 7 200 || true
            sleep 5
            adb logcat -d > logcat.txt
            if grep -q "FATAL EXCEPTION" logcat.txt; then grep -A 40 "FATAL EXCEPTION" logcat.txt; exit 1; fi
            adb shell pidof io.github.sinsluhi.obdai && echo "ПОСЛЕ 200 СЛУЧАЙНЫХ НАЖАТИЙ ЖИВ" || echo "процесс закрыт (обычно monkey ушёл в другое приложение)"
            adb shell screencap -p /sdcard/s2.png && adb pull /sdcard/s2.png s2.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-api${{ matrix.api }}
          path: |
            s1.png
            s2.png
            logcat.txt
