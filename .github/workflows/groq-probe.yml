name: Groq probe
# Ручная проверка ключа Groq: какие модели доступны и какие лимиты (tools/kb/probe.py).
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/kb/probe.py
        env:
          GROQ_API_KEY: ${{ secrets.AI_API_KEY }}
