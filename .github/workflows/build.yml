name: Build APK
on:
  push:
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "docs/**"
      - "tools/**"
      - "server/**"
      - "site/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/deploy-forum.yml"
      - ".github/workflows/kb.yml"
  workflow_dispatch:
permissions:
  contents: write
# Две сборки подряд не должны одновременно перезаписывать APK в релизе
concurrency:
  group: release-latest
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      # Постоянный ключ подписи: без него каждая сборка получала случайный debug-ключ раннера и обновление
      # не вставало поверх установленной версии (приходилось удалять приложение и терять историю).
      - name: Signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then echo "::warning::SIGNING_KEYSTORE_B64 не задан — сборка будет подписана случайным ключом"; exit 0; fi
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/obdai-release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/obdai-release.jks" >> "$GITHUB_ENV"
      - run: gradle assembleDebug
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          FORUM_URL: ${{ vars.FORUM_URL }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      # Отпечаток подписи в лог: у всех сборок он должен быть одинаковым (SHA-256 1d9ad032…450b9147).
      # keytool тут не годится — при minSdk 26 подпись только v2/v3, её видит apksigner.
      - name: Signature fingerprint
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256" || true
      # APK для выдачи по заявкам: сервер (forum.ps1) забирает его через gh run download и расшифровывает.
      # Артефакт публичного репозитория может скачать любой вошедший на GitHub, поэтому APK внутри зашифрован
      # (секрет APK_PASS, тот же пароль лежит у сервера в apk.pass). Без секрета артефакт не выкладывается.
      - name: Encrypt APK for the download server
        env:
          APK_PASS: ${{ secrets.APK_PASS }}
        run: |
          mkdir -p gated
          if [ -z "$APK_PASS" ]; then echo "APK_PASS не задан — артефакт для сервера пропущен"; exit 0; fi
          APK=app/build/outputs/apk/debug/app-debug.apk
          grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts > gated/version.txt
          # 1) для сервера целиком (админ «Скачать себе», приложение)
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in $APK -out gated/app.apk.enc -pass env:APK_PASS
          # 2) для сайта: APK под случайным паролем этой сборки лежит открыто на Pages (быстро, без туннеля),
          #    а сам пароль сервер выдаёт одобренной заявке один раз; у сервера он зашифрован общим APK_PASS
          export BUILD_PASS=$(openssl rand -hex 24)
          openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 -salt -in $APK -out gated/app.bin -pass env:BUILD_PASS
          printf '%s' "$BUILD_PASS" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -out gated/pass.enc -pass env:APK_PASS
          printf '{"run":"%s","version":"%s","size":%s,"sha256":"%s"}' "${{ github.run_id }}" "$(cat gated/version.txt)" \
            "$(stat -c%s $APK)" "$(sha256sum $APK | cut -d' ' -f1)" > gated/meta.json
          cat gated/meta.json
      # Пользовательский APK откладываем: следующий шаг пересобирает в ту же папку версию разработчика
      - run: mkdir -p out && cp app/build/outputs/apk/debug/app-debug.apk out/app-debug.apk
      # Версия разработчика (с режимом разработчика) — только для владельца: кнопка «Версия разработчика» в админке.
      # Тот же ключ подписи, поэтому ставится поверх пользовательской и обратно.
      - name: Developer build
        env:
          DEV_TOOLS: "true"
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          FORUM_URL: ${{ vars.FORUM_URL }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          APK_PASS: ${{ secrets.APK_PASS }}
        run: |
          if [ -z "$APK_PASS" ]; then echo "APK_PASS не задан — версия разработчика не выкладывается"; exit 0; fi
          gradle assembleDebug
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in app/build/outputs/apk/debug/app-debug.apk \
            -out gated/app-dev.apk.enc -pass env:APK_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: gated/
          if-no-files-found: ignore
          retention-days: 30
      # Открытая ссылка на APK в релизе. Переменная PUBLIC_APK=false её выключает: тогда APK только по заявке на сайте.
      - if: vars.PUBLIC_APK != 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Тестовая сборка
          prerelease: true
          files: out/app-debug.apk

