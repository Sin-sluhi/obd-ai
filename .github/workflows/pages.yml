name: Site
# Сайт site/ на GitHub Pages. Заявки на APK обслуживает server/forum (apk.py), адрес сервера сайт берёт из docs/forum_url.txt.
# Раз в 30 минут сайт пересобирается со свежим снимком новостей (site/news.json) — лента не зависит от туннеля.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/news/**"
      - "server/forum/news.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "7,37 * * * *"
  # новая сборка APK → сразу кладём её зашифрованную копию на сайт
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: News snapshot
        continue-on-error: true
        run: python tools/news/build.py site/news.json
      # Две последние удачные сборки: app-<run>.bin (APK под паролем сборки) + meta. Пароль знает только сервер заявок,
      # а сервер может отставать на одну сборку — поэтому держим две.
      - name: Gated APK
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/dl
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --status success -L 2 --json databaseId -q '.[].databaseId'); do
            rm -rf /tmp/g && gh run download "$id" -R "$GITHUB_REPOSITORY" -n apk -D /tmp/g || continue
            [ -f /tmp/g/app.bin ] || continue
            cp /tmp/g/app.bin "site/dl/app-$id.bin" && cp /tmp/g/meta.json "site/dl/meta-$id.json" && echo "сборка $id на сайте"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
